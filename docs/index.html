<style>
[hidden] { display: none !important; }
/* Layout: a field manual — outline rail on wide screens, a single reading column on phones; videos follow a light (VS Code Light-like) or dark theme. */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --surface-2: #E9EDF2; --surface-3: #DDE3EA;
  --ink: #111722; --ink-2: #465165; --ink-3: #737E93; --line: #D6DDE6; --line-2: #C3CCD8;
  --focus: #2D58E6; --btn: #111722; --btn-ink: #FFFFFF;
  --ok: #12804E; --ok-bg: #E3F4EB; --bad: #C23838; --bad-bg: #FBE7E7; --warn: #9A6200; --warn-bg: #FBF0D9;
  --d0: #5D6A82; --d1: #3D55D1; --d2: #A2620A; --d3: #0D7D62; --d4: #6C47C4; --d5: #BE4E1C; --d6: #B92A68;
  --font-ui: 'Archivo', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --font-read: 'Literata', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --r: 12px; --r-lg: 18px;
  --shadow: 0 1px 2px rgba(17, 23, 34, .06), 0 4px 14px rgba(17, 23, 34, .05);
  --side-w: 296px; --read-size: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1016; --surface: #141922; --surface-2: #1B212C; --surface-3: #252D3A;
    --ink: #E6EAF1; --ink-2: #A8B2C3; --ink-3: #7A8699; --line: #283141; --line-2: #36404F;
    --focus: #8DA6FF; --btn: #E6EAF1; --btn-ink: #0C1016;
    --ok: #46C98B; --ok-bg: #12291F; --bad: #FF7F7F; --bad-bg: #2E1517; --warn: #F0B54A; --warn-bg: #2C2312;
    --d0: #95A2BA; --d1: #8C9EFF; --d2: #E7AC52; --d3: #4CCFAC; --d4: #B79BFF; --d5: #FF9B68; --d6: #FF80B2;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1016; --surface: #141922; --surface-2: #1B212C; --surface-3: #252D3A;
  --ink: #E6EAF1; --ink-2: #A8B2C3; --ink-3: #7A8699; --line: #283141; --line-2: #36404F;
  --focus: #8DA6FF; --btn: #E6EAF1; --btn-ink: #0C1016;
  --ok: #46C98B; --ok-bg: #12291F; --bad: #FF7F7F; --bad-bg: #2E1517; --warn: #F0B54A; --warn-bg: #2C2312;
  --d0: #95A2BA; --d1: #8C9EFF; --d2: #E7AC52; --d3: #4CCFAC; --d4: #B79BFF; --d5: #FF9B68; --d6: #FF80B2;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.vp-lock, html.vp-lock body { overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--focus); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; font-family: var(--font-ui); letter-spacing: -0.01em; }
.mono { font-family: var(--font-mono); }
.eyebrow { font: 600 12px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.shell { min-height: 100vh; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand > span { display: flex; flex-direction: column; min-width: 0; }
.brand-name { display: block; font: 800 17px/1.1 var(--font-ui); font-stretch: 85%; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { display: block; font: 500 10.5px/1.2 var(--font-mono); color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 380px) { .brand-sub { display: none; } }
.top-sp { flex: 1; }
.top-resume { display: none; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }
.side { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(88vw, 340px); background: var(--surface); border-right: 1px solid var(--line); transform: translateX(-105%); transition: transform .25s ease; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 24px) max(14px, env(safe-area-inset-left, 0px)); }
.side.open { transform: none; box-shadow: 0 0 60px rgba(0, 0, 0, .3); }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgba(10, 14, 20, .45); }
.side-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.nav { display: grid; gap: 2px; margin-bottom: 18px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 600; }
.nav a svg { width: 20px; height: 20px; color: var(--ink-3); flex: none; }
.nav a:hover { background: var(--surface-2); }
.nav a.cur { background: var(--surface-2); }
.nav a.cur svg { color: var(--ink); }
.ol-title { margin: 6px 10px 8px; }
.ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ol-d { margin-top: 10px; padding: 0 10px; font: 700 12px/1.3 var(--font-ui); color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; }
.ol-d b { font-family: var(--font-mono); color: var(--dc); }
.ol a { display: grid; grid-template-columns: 18px 36px 1fr; gap: 6px; align-items: start; padding: 6px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 13.5px; line-height: 1.3; }
.ol a:hover { background: var(--surface-2); color: var(--ink); }
.ol a.cur { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.ol a .code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); padding-top: 1px; }
.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 72px; min-width: 0; }
.wrap { max-width: 1060px; margin: 0 auto; }
.read { max-width: 780px; margin: 0 auto; }
@media (min-width: 1100px) {
  .shell { display: grid; grid-template-columns: var(--side-w) 1fr; }
  .top { grid-column: 1 / -1; }
  .menu-btn, .side .close-btn, .scrim { display: none !important; }
  .side { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); height: calc(100vh - 56px - env(safe-area-inset-top, 0px)); transform: none; width: auto; z-index: 5; padding-top: 18px; }
  .top-resume { display: inline-flex; }
  .main { padding-left: 40px; padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--btn); background: var(--btn); color: var(--btn-ink); font-weight: 700; cursor: pointer; text-decoration: none; font-size: 15px; }
.btn svg { width: 18px; height: 18px; }
.btn:hover { filter: brightness(1.12); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.block { width: 100%; }
.link-btn { background: none; border: 0; padding: 0; color: var(--focus); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }

/* ---------- status + progress ---------- */
.st { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: middle; }
.bar { height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--fill, var(--ink)); border-radius: 99px; width: 0; transition: width .6s ease; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font: 600 12px/1.4 var(--font-mono); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.dc1 { --dc: var(--d1); } .dc2 { --dc: var(--d2); } .dc3 { --dc: var(--d3); } .dc4 { --dc: var(--d4); } .dc5 { --dc: var(--d5); } .dc6 { --dc: var(--d6); } .dc0, .dcF { --dc: var(--d0); }

/* ---------- home ---------- */
.hero { display: grid; gap: 18px; grid-template-columns: 1fr; margin-bottom: 26px; }
.hero h1 { font-size: clamp(28px, 4.4vw, 42px); font-weight: 800; font-stretch: 82%; line-height: 1.02; letter-spacing: -0.02em; }
.hero p { margin: 8px 0 0; color: var(--ink-2); max-width: 62ch; font-size: 16px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; min-width: 0; }
.stat .eyebrow { margin-bottom: 6px; }
.stat .v { font: 800 26px/1.05 var(--font-ui); font-stretch: 85%; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.stat .bar { margin-top: 10px; }
@media (min-width: 760px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.resume { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: 28px; }
.resume .t { font-weight: 800; font-size: 18px; font-stretch: 90%; }
.resume .m { color: var(--ink-2); font-size: 14px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 30px 0 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 22px; font-weight: 800; font-stretch: 88%; }
.dom { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); margin-bottom: 12px; overflow: hidden; }
.dom > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 6px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px 14px 0; }
.dom > summary::-webkit-details-marker { display: none; }
.dom-stripe { align-self: stretch; background: var(--dc); }
.dom-t { min-width: 0; }
.dom-t .eyebrow { color: var(--dc); }
.dom-t h3 { font-size: 17px; font-weight: 750; margin-top: 3px; line-height: 1.25; }
.dom-m { font-size: 13px; color: var(--ink-2); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.dom-r { text-align: right; display: grid; gap: 6px; justify-items: end; min-width: 84px; }
.dom-r .pct { font: 800 20px/1 var(--font-ui); font-variant-numeric: tabular-nums; }
.dom-r .bar { width: 84px; --fill: var(--dc); }
.mods { list-style: none; margin: 0; padding: 0 0 6px; border-top: 1px solid var(--line); }
.mod a { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; text-decoration: none; color: var(--ink); }
.mod a:hover { background: var(--surface-2); }
.mod + .mod a { border-top: 1px solid var(--line); }
.mod .code { font: 600 12px/1 var(--font-mono); color: var(--dc); margin-right: 6px; }
.mod .tt { font-weight: 600; line-height: 1.3; }
.mod .mm { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
.mod .soon { font: 600 11px/1 var(--font-mono); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.side-cards { display: grid; gap: 14px; grid-template-columns: 1fr; margin-top: 8px; }
@media (min-width: 900px) { .side-cards { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; min-width: 0; }
.card h3 { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
.wbars { display: grid; gap: 8px; }
.wbar { display: grid; grid-template-columns: 26px 1fr 40px; gap: 10px; align-items: center; font-size: 13px; }
.wbar b { font-family: var(--font-mono); color: var(--dc); }
.wbar .bar { height: 10px; --fill: var(--dc); }
.wbar span { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; }

/* ---------- module + lesson ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); margin-bottom: 14px; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.m-head { margin-bottom: 20px; }
.m-head .eyebrow { color: var(--dc); }
.m-head h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; font-stretch: 84%; line-height: 1.06; margin-top: 6px; }
.m-head .lede { font: 400 17px/1.6 var(--font-read); color: var(--ink-2); margin: 12px 0 0; max-width: 64ch; }
.m-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.objectives { margin: 18px 0; padding: 16px 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.objectives h2 { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
.objectives ul { margin: 0; padding-left: 20px; font: 400 16px/1.55 var(--font-read); }
.objectives li + li { margin-top: 4px; }
.cover { margin-top: 12px; display: grid; gap: 6px; }
.cover-i { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: 13.5px; color: var(--ink-2); }
.cover-i b { font-family: var(--font-mono); font-weight: 600; color: var(--dc); }
.sections { list-style: none; margin: 18px 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.sections li + li { border-top: 1px solid var(--line); }
.sections a { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 13px 16px; color: var(--ink); text-decoration: none; }
.sections a:hover { background: var(--surface-2); }
.sections .n { font: 600 12px/1 var(--font-mono); color: var(--ink-3); }
.sections .tt { font-weight: 650; }
.sections .mm { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lesson-top { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 10; background: var(--bg); padding: 10px 0; margin: -22px 0 14px; border-bottom: 1px solid var(--line); }
.lesson-top .row { flex-wrap: nowrap; }
.lesson-top .lt { min-width: 0; flex: 1; }
.lesson-top .lt b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lesson-top .lt span { font-size: 12px; color: var(--ink-3); }
.lesson-top .bar { height: 5px; margin-top: 8px; --fill: var(--dc); }
.s-head { margin: 8px 0 22px; }
.s-head .eyebrow { color: var(--dc); }
.s-head h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; font-stretch: 85%; line-height: 1.08; margin-top: 8px; }
.s-cover { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.s-cover .pill { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.blocks { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
.blocks > * { min-width: 0; }
.prose { font: 400 var(--read-size)/1.68 var(--font-read); color: var(--ink); }
.prose p { margin: 0 0 1em; }
.prose p:last-child { margin-bottom: 0; }
.prose h3 { font: 800 20px/1.25 var(--font-ui); font-stretch: 90%; margin: 1.4em 0 .5em; }
.prose h3:first-child { margin-top: 0; }
.prose ul, .prose ol { margin: 0 0 1em; padding-left: 1.3em; }
.prose li + li { margin-top: .35em; }
.prose strong { font-weight: 700; }
.prose code { font: 500 .84em/1 var(--font-mono); background: var(--surface-2); padding: .15em .35em; border-radius: 5px; }
.prose a { text-underline-offset: 3px; }
.callout { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 16px 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--cc, var(--ink-3)); }
.callout svg { width: 24px; height: 24px; color: var(--cc, var(--ink-3)); margin-top: 2px; }
.callout .ct { font: 800 13px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--cc, var(--ink-2)); margin-bottom: 6px; }
.callout .prose { font-size: calc(var(--read-size) - 1px); }
.callout.exam { --cc: var(--focus); } .callout.key { --cc: var(--d4); } .callout.real { --cc: var(--d3); } .callout.warn { --cc: var(--bad); } .callout.remember { --cc: var(--d2); }
.blk-title { font: 800 18px/1.3 var(--font-ui); font-stretch: 92%; margin-bottom: 10px; }
.blk-sub { font-size: 14px; color: var(--ink-2); margin: -4px 0 12px; }
.flips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.flip { position: relative; min-height: 170px; perspective: 1000px; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
.flip-i { position: absolute; inset: 0; transition: transform .5s ease; transform-style: preserve-3d; }
.flip.on .flip-i { transform: rotateY(180deg); }
.flip-f, .flip-b { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--surface); }
.flip-f { justify-content: center; align-items: center; text-align: center; font: 800 19px/1.25 var(--font-ui); font-stretch: 92%; }
.flip-b { transform: rotateY(180deg); font: 400 15px/1.5 var(--font-read); background: var(--surface-2); overflow: auto; }
.flip-f::after { content: "Tap to flip"; position: absolute; bottom: 10px; font: 500 11px/1 var(--font-mono); color: var(--ink-3); letter-spacing: .06em; }
.flip.done .flip-f { box-shadow: inset 0 -3px 0 var(--ok); }
.acc { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.acc details + details { border-top: 1px solid var(--line); }
.acc summary { cursor: pointer; list-style: none; padding: 14px 16px; font-weight: 700; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "+"; font: 400 24px/1 var(--font-ui); color: var(--ink-3); }
.acc details[open] summary::after { content: "–"; }
.acc details[open] summary { color: var(--dc, var(--ink)); }
.acc .prose { padding: 0 16px 16px; font-size: calc(var(--read-size) - 1px); }
.tabs { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }

.tab-p { padding: 16px; }
.steps { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 16px; }
.steps-n { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }

.steps .row { margin-top: 14px; }
.prose .tbl { margin: 14px 0 20px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14.5px; }
.tbl th, .tbl td { text-align: left; padding: 11px 14px; vertical-align: top; border-bottom: 1px solid var(--line); }
.tbl th { font: 700 12px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); }

.scn { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 18px; }

.q { display: grid; gap: 12px; }
.q-stem { font: 600 17px/1.5 var(--font-ui); }
.q-opts { display: grid; gap: 8px; }
.q-opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 15.5px; line-height: 1.45; color: var(--ink); }

.match { display: grid; gap: 12px; }

.match button { text-align: left; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 14px; line-height: 1.35; min-height: 48px; color: var(--ink); }

.match button.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ink); }
.match button.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--ink); }

.diagram { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: #F7F8FA; }
.diagram svg { display: block; width: 100%; height: auto; }

.s-foot { margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

/* ---------- quizzes ---------- */
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }

.timer.low { background: var(--warn-bg); color: var(--warn); }
.qnav { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-top: 16px; }
.qnav button { height: 36px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font: 600 12px/1 var(--font-mono); cursor: pointer; color: var(--ink-2); position: relative; }
.qnav button.ans { background: var(--surface-3); color: var(--ink); }

.qnav button.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.qnav button.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.result { text-align: center; padding: 26px 18px; }
.result .big { font: 800 64px/1 var(--font-ui); font-stretch: 80%; font-variant-numeric: tabular-nums; }
.result .verdict { font-weight: 700; margin-top: 8px; }
.review-list { display: grid; gap: 14px; margin-top: 18px; }
.rv-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.rv-item .q-stem { font-size: 15.5px; }
.rv-ans { font-size: 14.5px; margin-top: 8px; display: grid; gap: 4px; }
.rv-ans .you.bad { color: var(--bad); } .rv-ans .you.ok { color: var(--ok); }
.tests-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 8px; align-content: start; border-top: 4px solid var(--dc, var(--ink)); }
.tcard h3 { font-size: 16px; font-weight: 800; }
.tcard .m { font-size: 13px; color: var(--ink-2); }

/* ---------- plan / performance / glossary / prefs ---------- */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > * { min-width: 0; } .field select { max-width: 100%; }
.field label { font-weight: 700; font-size: 14px; }
.field .help { font-size: 13px; color: var(--ink-3); }
input[type="date"], input[type="search"], input[type="text"], select, textarea { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); min-height: 44px; max-width: 100%; }
textarea { width: 100%; min-height: 120px; font: 13px/1.4 var(--font-mono); }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.days label { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line-2); cursor: pointer; font-weight: 600; font-size: 14px; }
.days input { accent-color: var(--btn); }
.plan-list { display: grid; gap: 8px; }
.plan-day { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.plan-day.today { border-color: var(--btn); box-shadow: inset 0 0 0 1px var(--btn); }
.plan-day .d { font: 700 13px/1.3 var(--font-mono); }
.plan-day .d small { display: block; color: var(--ink-3); font-weight: 500; }
.plan-day ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.plan-day .k { font: 600 12px/1.3 var(--font-mono); color: var(--ink-3); white-space: nowrap; }
.perf-row { display: grid; grid-template-columns: 34px 1fr 64px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.perf-row:last-child { border-bottom: 0; }
.perf-row b { font-family: var(--font-mono); color: var(--dc); }
.perf-row .bar { height: 10px; --fill: var(--dc); margin-top: 6px; }
.perf-row .v { text-align: right; font: 800 18px/1 var(--font-ui); font-variant-numeric: tabular-nums; }
.perf-row .s { font-size: 12.5px; color: var(--ink-3); }
.spark { display: flex; gap: 4px; align-items: flex-end; height: 64px; }
.spark i { flex: 1; background: var(--ink); opacity: .82; border-radius: 3px 3px 0 0; min-height: 2px; }
.spark i.z { background: var(--surface-3); opacity: 1; }
.gl-list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.gl-i { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.gl-i:last-child { border-bottom: 0; }
.gl-i dt { font-weight: 800; }
.gl-i dt a { font: 600 12px/1 var(--font-mono); margin-left: 8px; text-decoration: none; }
.gl-i dd { margin: 4px 0 0; font: 400 15.5px/1.55 var(--font-read); color: var(--ink-2); }
.bp-d { margin-bottom: 18px; }
.bp-m { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); margin-bottom: 10px; overflow: hidden; }
.bp-m h3 { font-size: 15px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.bp-b { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 14px; align-items: center; }
.bp-b:last-child { border-bottom: 0; }
.bp-b .w { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.review-card { max-width: 560px; margin: 0 auto; }
.rcard { min-height: 260px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); padding: 22px; display: grid; align-content: center; text-align: center; gap: 12px; box-shadow: var(--shadow); cursor: pointer; }
.rcard .term { font: 800 26px/1.2 var(--font-ui); font-stretch: 88%; }
.rcard .def { font: 400 17px/1.6 var(--font-read); color: var(--ink-2); }
.toast-g { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--btn); color: var(--btn-ink); padding: 11px 16px; border-radius: 12px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.confirm { margin-top: 10px; padding: 14px; border-radius: var(--r); background: var(--bad-bg); display: grid; gap: 10px; }
.empty { padding: 22px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: var(--r-lg); }
.note-ind { font-size: 12.5px; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: center; }
.note-ind i { width: 8px; height: 8px; border-radius: 99px; background: var(--ink-3); display: inline-block; }
.note-ind.synced i { background: var(--ok); }

/* ---------- video player (fixed dark look, both themes) ---------- */
/* Video player chrome. Light by default (dark text on light surfaces); data-vtheme="dark" restores the dark look. */
.vp { --vp-bg: #FFFFFF; --vp-ink: #1F2328; --vp-dim: #4A5361; --vp-faint: #5F6A77; --vp-line: #D8DEE4; --vp-stage: #F7F8FA; --vp-seg: #D8DEE4; --vp-hover: #EEF1F4; --vp-off: #6E7781;
  --vp-card: #FFFFFF; --vp-card-line: #D0D7DE; --vp-overlay: rgba(242, 244, 247, .96); --vp-opt: #F6F8FA; --vp-opt-line: #C9D1DA; --vp-badge: #E3E8EE;
  --vp-ok: #1A7F37; --vp-ok-bg: #E6F4EA; --vp-bad: #CF222E; --vp-bad-bg: #FDECEC; --vp-fb: #24292F; --vp-on-accent: #FFFFFF; --vp-tx: #24292F; --vp-tx-hover: #000000;
  --vp-poster: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, .72) 45%, rgba(255, 255, 255, .97) 100%);
  --vp-shadow: 0 1px 3px rgba(31, 35, 40, .08), 0 8px 24px rgba(31, 35, 40, .08);
  position: relative; background: var(--vp-bg); color: var(--vp-ink); border: 1px solid var(--vp-line); border-radius: var(--r-lg); overflow: hidden; outline: none; box-shadow: var(--vp-shadow); }
.vp[data-vtheme="dark"] { --vp-bg: #0A1120; --vp-ink: #E9EDF5; --vp-dim: #9AA7C0; --vp-faint: #5E6D8F; --vp-line: #18233B; --vp-stage: #0E1527; --vp-seg: #24314F; --vp-hover: #1A2540; --vp-off: #66759A;
  --vp-card: #121B31; --vp-card-line: #26355A; --vp-overlay: rgba(8, 13, 25, .9); --vp-opt: #172240; --vp-opt-line: #2E3D62; --vp-badge: #24345A;
  --vp-ok: #3FD69B; --vp-ok-bg: #123326; --vp-bad: #FF6363; --vp-bad-bg: #3A1820; --vp-fb: #D5DCEA; --vp-on-accent: #0A1120; --vp-tx: #CBD3E2; --vp-tx-hover: #FFFFFF;
  --vp-poster: linear-gradient(180deg, rgba(10, 17, 32, .15) 0%, rgba(10, 17, 32, .55) 45%, rgba(10, 17, 32, .94) 100%);
  --vp-shadow: 0 10px 30px rgba(8, 13, 25, .25); }
.vp:focus-visible { outline: 3px solid var(--vp-accent); outline-offset: 3px; }
.vp-screen { position: relative; aspect-ratio: 16 / 9; width: 100%; background: var(--vp-stage); }
.vp.vp-wait .vp-screen::after { content: ""; position: absolute; right: 14px; bottom: 16px; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--vp-line); border-top-color: var(--vp-accent); animation: vp-spin .8s linear infinite; pointer-events: none; }
@keyframes vp-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .vp.vp-wait .vp-screen::after { animation-duration: 2.4s; } }
.vs { display: block; width: 100%; height: 100%; font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; }
.vs .op { opacity: 0; transition: opacity .5s ease; }
.vs .rv { opacity: 0; transform: translateY(16px); transition: opacity .5s ease, transform .6s cubic-bezier(.2, .7, .2, 1); }
.vs .rv.pop { transform: scale(.86); transform-box: fill-box; transform-origin: 50% 50%; }
.vs .op.on, .vs .rv.on { opacity: 1; }
.vs .rv.on { transform: none; }
.vs .dimmed { opacity: .26 !important; }
.vs.vt-light .dimmed { opacity: .42 !important; }
.vs .scene { transition: opacity .42s ease; }
.vs .scene.entering, .vs .scene.leaving { opacity: 0; }
.vs .dash { stroke-dasharray: 13 11; animation: vdash 1s linear infinite; }
@keyframes vdash { to { stroke-dashoffset: -24; } }
.vs .pulse { animation: vpulse 1.8s ease-in-out infinite; }
@keyframes vpulse { 50% { opacity: .45; } }
.vs .grow-x { transform-box: fill-box; transform-origin: 0 50%; transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
.vs .grow-y { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
.vs .draw { transition: stroke-dashoffset 1.6s ease; }
.vs .kmove { transition: transform .14s ease; }
.vs .mover { transition: transform 1.25s cubic-bezier(.4, 0, .2, 1); }
.vs .scroller { transition: transform .6s cubic-bezier(.2, .7, .2, 1); }
.vs.instant *, .vs.instant { transition: none !important; }
.vs.posterframe .ttxt { opacity: 0 !important; }
.vs.paused * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .vs .dash, .vs .pulse { animation: none; } .vs .rv { transform: none; } }
.vp-poster { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: clamp(14px, 3.5vw, 28px); background: var(--vp-poster); }
.vp-pk { font: 600 clamp(10px, 1.6vw, 12px)/1.2 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--vp-accent); }
.vp-pt { font: 800 clamp(19px, 3.6vw, 32px)/1.05 var(--font-ui); font-stretch: 84%; max-width: 24ch; }
.vp-pm { font-size: clamp(12px, 1.8vw, 14px); color: var(--vp-dim); }
.vp-pbtn { margin-top: 10px; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 99px; padding: 10px 20px 10px 14px; background: var(--vp-accent); color: var(--vp-on-accent); font-weight: 800; cursor: pointer; font-size: 15px; }
.vp-pbtn svg { width: 22px; height: 22px; }
.vp-cap { min-height: 3.4em; padding: 10px 16px 8px; font: 500 15.5px/1.5 var(--font-ui); color: var(--vp-ink); background: var(--vp-bg); border-top: 1px solid var(--vp-line); }

.vp-bar { padding: 8px 14px 4px; cursor: pointer; }

.vp-bar:hover .vp-track { height: 9px; }
.vp-ctl { display: flex; align-items: center; gap: 2px; padding: 2px 8px 8px; flex-wrap: nowrap; }
.vp-b { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 0; background: none; color: var(--vp-ink); border-radius: 10px; cursor: pointer; flex: none; font: 700 13px/1 var(--font-mono); }
.vp-b svg { width: 22px; height: 22px; }
.vp-b:hover { background: var(--vp-hover); }
.vp-b.off { color: var(--vp-off); }
.vp-rate { width: auto; padding: 0 8px; }

@media (max-width: 420px) { .vp-prev, .vp-chb { display: none; } .vp-time { font-size: 11.5px; } }
.vp-chap { position: absolute; right: 10px; bottom: 10px; top: 10px; width: min(320px, 80%); overflow: auto; background: var(--vp-card); border: 1px solid var(--vp-card-line); border-radius: 14px; padding: 10px; box-shadow: var(--vp-shadow); }

.vp-quiz, .vp-end { position: absolute; inset: 0; display: grid; place-items: center; place-items: safe center; padding: 12px; background: var(--vp-overlay); overflow: auto; }
.vp-quiz[hidden], .vp-end[hidden], .vp-chap[hidden], .vp-toast[hidden], .vp-poster[hidden] { display: none; }
.vp-qc, .vp-endc { width: min(640px, 100%); background: var(--vp-card); border: 1px solid var(--vp-card-line); box-shadow: var(--vp-shadow); border-radius: 16px; padding: clamp(14px, 3vw, 22px); }
.vp-qk { font: 700 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--vp-accent); margin-bottom: 8px; }
.vp-qq { font: 700 clamp(14px, 2.3vw, 18px)/1.4 var(--font-ui); margin-bottom: 12px; }
.vp-qo { display: grid; gap: 8px; }

  function pickQuestions(bank, mods, count, seed, preferExam) {
    const r = (() => { let s = seed; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; })();
    const sh = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    let pool = [];
    mods.forEach(id => { const e = bank[id]; if (!e) return; const dom = MOD[id].domain; const tag = q => Object.assign({ mod: id, dom }, q); pool = pool.concat((preferExam ? e.exam : e.quiz).map(tag), (preferExam ? e.quiz : e.exam).map(tag)); });
    if (!preferExam) return sh(pool).slice(0, count);
    const exam = sh(pool.filter(q => /-x\d/.test(q.id))), rest = sh(pool.filter(q => !/-x\d/.test(q.id)));
    return exam.concat(rest).slice(0, count);
  }

  function planSchedule(limitDays) {
    const g = goal(); if (!g) return null;
    const items = sequence().filter(x => !x.done);
    const cap = Math.max(10, g.per); const out = []; let i = 0; let carry = 0;
    const t = parseDay(S.target); const d = parseDay(dayKey());
    if (g.today >= cap) d.setDate(d.getDate() + 1);
    while (i < items.length && out.length < limitDays && d <= new Date(t.getTime() + 864e5 * 60)) {
      if (studyDay(d)) { const day = { date: new Date(d), items: [], kp: 0 }; let budget = cap - (dayKey(d) === dayKey() ? g.today : 0) + carry; carry = 0; while (i < items.length && (budget > 0 || !day.items.length)) { day.items.push(items[i]); day.kp += items[i].kp; budget -= items[i].kp; i++; } carry = Math.min(0, budget); out.push(day); }
      d.setDate(d.getDate() + 1);
    }
    return { days: out, remainingItems: items.length - i };
  }

    q('#rate').addEventListener('change', e => { S.prefs.rate = +e.target.value; commit(); });
    q('#narr').addEventListener('change', e => { S.prefs.narration = e.target.checked; commit(); });
    q('#caps').addEventListener('change', e => { S.prefs.captions = e.target.checked; commit(); });
    q('#tsize').addEventListener('change', e => { S.prefs.text = e.target.value; setReadSize(); commit(); });
    let sample = null;
    q('.test-voice').addEventListener('click', () => {
      V.TTS.cancel(); if (sample) { sample.pause(); sample = null; }
      if (S.prefs.voiceSrc !== 'device' && AU.sample) {
        sample = new Audio(AU.sample + (BUILD.v ? '?v=' + BUILD.v : '')); try { sample.playbackRate = S.prefs.rate || 1; } catch (e) { }
        const pr = sample.play(); if (pr && pr.catch) pr.catch(() => toast('The sample couldn’t play. Check your volume and connection.'));
        return;
      }
      V.TTS.broken = false;
      try { V.TTS.speak('This is how your video lessons will sound. Prompt injection hides instructions inside content the model reads.', { rate: S.prefs.rate || 1, voice: V.TTS.best(S.prefs.voice) }); } catch (e) { toast('Speech isn’t available in this browser'); }
    });
    q('.exp').addEventListener('click', () => { const txt = JSON.stringify(S); const done = () => toast('Progress copied'); try { navigator.clipboard.writeText(txt).then(done, () => { q('.imp').hidden = false; q('#impx').value = txt; q('#impx').select(); toast('Select and copy the text below'); }); } catch (e) { q('.imp').hidden = false; q('#impx').value = txt; q('#impx').select(); } });
    if (q('.dl')) q('.dl').addEventListener('click', () => { try { const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ai-security-progress-' + dayKey() + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Backup downloaded'); } catch (e) { toast('Download isn’t available here. Use Copy progress instead.'); } });
    q('.imp-f').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const s = normalize(JSON.parse(String(rd.result))); if (!s.v) throw new Error('bad'); S = s; commit(); toast('Progress restored'); render(); } catch (err) { toast('That file isn’t a valid backup'); } }; rd.readAsText(f); });
    q('.imp-t').addEventListener('click', () => { q('.imp').hidden = !q('.imp').hidden; });
    q('.imp-go').addEventListener('click', () => { try { const s = normalize(JSON.parse(q('#impx').value)); if (!s.v) throw new Error('bad'); S = s; commit(); toast('Progress restored'); render(); } catch (e) { toast('That text isn’t a valid backup'); } });
    q('.rst').addEventListener('click', () => { const box = q('.rst-c'); box.innerHTML = '<div class="confirm"><div><strong>Reset everything?</strong> This clears progress on every device signed in to your account.</div><div class="row"><button type="button" class="btn small y">Reset progress</button><button type="button" class="btn ghost small n">Cancel</button></div></div>'; box.querySelector('.y').addEventListener('click', () => { const keep = S.prefs; S = fresh(); S.prefs = keep; commit(); toast('Progress reset'); render(); }); box.querySelector('.n').addEventListener('click', () => { box.innerHTML = ''; }); });
    syncInd();
  }

  render();
  initSync();
  window.__APP = { get state() { return S; }, render, sequence, earned };
})();
